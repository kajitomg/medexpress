services:
  client:
    container_name: "client"
    build:
      dockerfile: ../docker/client.Dockerfile
      context: ../client
    depends_on:
      database:
        condition: service_started
      cms:
        condition: service_healthy
    env_file:
      - ../.env
      - ../client/.env
    volumes:
      - ../static:/opt/application/public:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://client:3000/" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 4m
      start_interval: 10s
    command: sh -c "npm run build && npm run start"
    ports:
      - "3000:3000"

  cms:
    container_name: "cms"
    restart: unless-stopped
    build:
      dockerfile: ../docker/cms.Dockerfile
      context: ../cms
    depends_on:
      - database
    env_file:
      - ../.env
      - ../cms/.env
    volumes:
      - ../cms/public:/opt/application/public
      - ../static:/opt/application/public/uploads
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_HOST=database
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_SSL=${POSTGRES_SSL}
      - STRAPI_ENVIRONMENT=development
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://cms:1337/health" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 1m30s
      start_interval: 5s
    command: sh -c "npm run build && npm run start"
    ports:
      - "1337:1337"

  database:
    container_name: "database"
    image: postgres:16
    env_file:
      - ../.env
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      - 5432:${POSTGRES_PORT}

  pgadmin:
    container_name: "pgadmin"
    image: dpage/pgadmin4
    depends_on:
      - database
    env_file:
      - ../.env
    volumes:
      - database_data:/var/lib/postgresql

  nginx:
    container_name: "nginx"
    image: nginx:latest
    depends_on:
      - client
      - cms
      - pgadmin
    env_file:
      - ../.env
    volumes:
      - ../nginx:/etc/nginx/conf.d
      - ../static:/var/www/static
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
  certbot:
    container_name: "certbot"
    image: certbot/certbot
    depends_on:
      client:
        condition: service_healthy
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email ${SSL_EMAIL} -d ${DOMAIN} --agree-tos

volumes:
  database_data:
