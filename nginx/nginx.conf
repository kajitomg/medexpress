upstream strapi {
  server cms:1337;
}

server {
  server_name med-ekspress.ru www.med-ekspress.ru;
  listen 80;
  listen [::]:80;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  server_name med-ekspress.ru www.med-ekspress.ru;
  listen 443 default_server ssl http2;
  listen [::]:443 ssl http2;
  root /var/www;

  ssl_certificate /etc/nginx/ssl/live/med-ekspress.ru/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/med-ekspress.ru/privkey.pem;

  location / {
    try_files /static/$uri @nodeproxy;
  }

  location @nodeproxy {
    proxy_pass                  https://client:3000;
    proxy_http_version          1.1;
    proxy_set_header            Upgrade $http_upgrade;
    proxy_set_header            Connection 'upgrade';
    proxy_set_header            Host $host;
    proxy_cache_bypass          $http_upgrade;
    proxy_redirect              off;
  }

  location /pgadmin/ {
    proxy_pass                  https://pgadmin;
    proxy_http_version          1.1;
    proxy_set_header            Host $host;
    proxy_set_header            X-Script-Name /pgadmin;
  }

  location /admin/ {
    proxy_pass                  https://strapi;
    default_type                application/json;
    proxy_http_version          1.1;
    proxy_set_header            Upgrade $http_upgrade;
    proxy_set_header            Connection 'upgrade';
    proxy_set_header            Host $host;
    proxy_cache_bypass          $http_upgrade;
    proxy_set_header            X-Script-Name /admin;
  }
}