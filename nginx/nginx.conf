
server {
    listen 80 default_server;

    server_name ivanuskov.ru www.ivanuskov.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/ivanuskov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivanuskov.ru/privkey.pem;
    server_name ivanuskov.ru www.ivanuskov.ru;
    root /var/www;


    location / {
        try_files /static/$uri @nodeproxy;
    }

    location @nodeproxy {
        proxy_pass                  http://client:3000;
        proxy_http_version          1.1;
        proxy_set_header            Upgrade $http_upgrade;
        proxy_set_header            Connection 'upgrade';
        proxy_set_header            Host $host;
        proxy_cache_bypass          $http_upgrade;
        proxy_redirect              off;
    }

    location /pgadmin/ {
        proxy_pass                  http://pgadmin;
        proxy_http_version          1.1;
        proxy_set_header            Host $host;
        proxy_set_header            X-Script-Name /pgadmin;
    }

    location /panel/ {
        rewrite ^/panel/?(.*)$ /$1 break;
        proxy_pass                  http://cms:1337;
        default_type                application/json;
        proxy_http_version          1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass_request_headers on;
    }

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
