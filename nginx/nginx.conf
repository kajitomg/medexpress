upstream strapi {
    server cms:1337;
}

events {
    worker_connections  1024;
}

http {
    server_tokens off;
    charset utf-8;

    server {
           listen 80 default_server;

           server_name med-ekspress.ru www.med-ekspress.ru;

           return 301 https://$host$request_uri;
       }

       server {
           listen 443 ssl http2;

           ssl_certificate     /etc/letsencrypt/live/med-ekspress.ru/fullchain.pem;
           ssl_certificate_key /etc/letsencrypt/live/med-ekspress.ru/privkey.pem;
           server_name med-ekspress.ru;
           root /var/www/html;
           index index.php index.html index.htm;


           location / {
               try_files /static/$uri @nodeproxy;
           }

           location @nodeproxy {
               proxy_pass                  http://client:3000;
               proxy_http_version          1.1;
               proxy_set_header            Upgrade $http_upgrade;
               proxy_set_header            Connection 'upgrade';
               proxy_set_header            Host $host;
               proxy_cache_bypass          $http_upgrade;
               proxy_redirect              off;
           }

           location /pgadmin/ {
               proxy_pass                  http://pgadmin;
               proxy_http_version          1.1;
               proxy_set_header            Host $host;
               proxy_set_header            X-Script-Name /pgadmin;
           }

           location /admin/ {
               proxy_pass                  http://strapi;
               default_type                application/json;
               proxy_http_version          1.1;
               proxy_set_header            Upgrade $http_upgrade;
               proxy_set_header            Connection 'upgrade';
               proxy_set_header            Host $host;
               proxy_cache_bypass          $http_upgrade;
               proxy_set_header            X-Script-Name /admin;
           }

           location ~ /.well-known/acme-challenge/ {
               root /var/www/certbot;
           }
       }
}